services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    init: true
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8787}:8787"
    environment:
      PORT: 8787
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?INTEGRATION_ENCRYPTION_KEY is required}
      # Shared Google OAuth app for the one-click "Connect Google Calendar"
      # button. Optional, but all three must be set together (Backend/src/env.ts
      # refuses to start otherwise). Only the API uses them, not the worker.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      # Optional public website-form lead intake. Set both together or leave
      # both blank (endpoint stays disabled). Only the API uses them.
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      INGEST_WORKSPACE_ID: ${INGEST_WORKSPACE_ID:-}    restart: unless-stopped

  worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    init: true
    command: ["node", "dist/src/worker.js"]
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?INTEGRATION_ENCRYPTION_KEY is required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-MOTM Technologies}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-10000}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-20}
      WORKER_DRY_RUN: ${WORKER_DRY_RUN:-false}
    restart: unless-stopped
    depends_on:
      - backend

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      # Vite bakes these into the static bundle at build time — nginx serves
      # static files with no server-side runtime to read env vars from after
      # the image is built, so these must be build args, not `environment:`.
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?VITE_SUPABASE_URL is required}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?VITE_SUPABASE_ANON_KEY is required}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8787}
    init: true
    ports:
      # nginx.conf hardcodes `listen 8080` inside the container (the
      # nginx-unprivileged base image's default) — only the host side of this
      # mapping is configurable.
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      - backend
